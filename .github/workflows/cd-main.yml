name: CD - Deploy a Azure

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Construir y Desplegar en Azure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Ejecutar pruebas
      run: mvn test
    
    - name: Construir aplicación
      run: mvn clean package -DskipTests
    
    - name: Listar archivos generados
      run: ls -la target/
    
    - name: Desplegar a Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: target/*.jar
    
    - name: Verificar despliegue
      run: |
        echo "🚀 Aplicación desplegada exitosamente"
        echo "📍 URL: https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        echo "📚 Swagger: https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/swagger-ui/index.html"